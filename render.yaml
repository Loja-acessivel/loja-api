services:
  - type: web
    name: loja-api
    runtime: docker
    plan: free
    healthCheckPath: /produto
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_CLASS_NAME
        value: org.postgresql.Driver
      - key: JPA_DDL_AUTO
        value: validate
      - key: CLOUDINARY_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
